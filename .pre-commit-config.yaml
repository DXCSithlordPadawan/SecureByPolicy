# Pre-Commit Configuration: SecureByPolicy Gatekeeper
# Reference: Developer_Remediation_Guide.md, Draft-Email.md
#
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files
#
# All hooks in this file serve as the "Local (Client)" tier of the
# Decentralized Execution, Centralized Governance security model.
# Evidence of successful local scans is stamped into the commit message
# as [COMPLIANCE-SCAN-PASSED] so that the server-side pre-receive hook
# can verify that local checks were NOT bypassed.

repos:
  # ── Baseline secret & credential detection ─────────────────────────────
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
        name: "SecureByPolicy: Detect hardcoded secrets (OWASP A07)"

  # ── Python static analysis (Bandit – STIG V-222637) ────────────────────
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        name: "SecureByPolicy: Python static analysis (Bandit)"
        args: ["-r", "app/scripts/", "-ll"]

  # ── Python linting / style (Ruff) ──────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.7
    hooks:
      - id: ruff
        name: "SecureByPolicy: Python linting (Ruff)"
        args: ["--fix"]

  # ── Dockerfile / Containerfile linting (Hadolint) ──────────────────────
  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint
        name: "SecureByPolicy: Dockerfile linting (Hadolint)"
        files: "(dockerfile|Dockerfile|Containerfile)"

  # ── Stamp compliance evidence into commit message ──────────────────────
  # This hook appends [COMPLIANCE-SCAN-PASSED] to the commit message after
  # all scans above pass, satisfying the NIST SI-7 evidence requirement
  # verified by the server-side pre-receive orchestrator.
  - repo: local
    hooks:
      - id: stamp-compliance-evidence
        name: "SecureByPolicy: Stamp [COMPLIANCE-SCAN-PASSED] evidence (NIST SI-7)"
        language: system
        stages: [commit-msg]
        entry: bash -c 'grep -q "\[COMPLIANCE-SCAN-PASSED\]" "$1" || echo "\n[COMPLIANCE-SCAN-PASSED]" >> "$1"'
        pass_filenames: false
